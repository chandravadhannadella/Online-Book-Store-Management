<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header class="site-header" role="banner">
        <div class="container">
            <div class="header-content">
                <h1 class="site-title">Online Book Store Management System</h1>
                <p class="site-tagline">Buy Book App</p>
            </div>
        </div>
    </header>

    <nav class="site-nav" role="navigation" aria-label="Main navigation">
        <div class="container">
            <ul class="nav-list">
                <li><a href="Home.html" class="nav-link">Home</a></li>
                <li><a href="Admin.html" class="nav-link active" aria-current="page">Admin</a></li>
                <li><a href="Seller.html" class="nav-link">Seller</a></li>
                <li><a href="Buyer.html" class="nav-link">Buyer</a></li>
                <li><a href="About.html" class="nav-link">About</a></li>
                <li><a href="Contact.html" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content" role="main">
        <div class="container container-form">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Admin Login</h2>
                </div>
                <div class="card-body">
                    <form action="#" method="post" novalidate>
                        <div class="form-group">
                            <label for="adminname" class="form-label">Admin Name <span class="required"></span></label>
                            <input type="text" 
                                   id="adminname" 
                                   name="adminname" 
                                   class="form-input" 
                                   placeholder="Enter Admin Name" 
                                   required 
                                   autocomplete="username">
                        </div>
                        
                        <div class="form-group">
                            <label for="password" class="form-label">Password <span class="required"></span></label>
                            <input type="password" 
                                   id="password" 
                                   name="password" 
                                   class="form-input" 
                                   placeholder="Enter Password" 
                                   required 
                                   autocomplete="current-password">
                        </div>
                        
                        <div class="form-group mt-xl">
                            <button type="submit" class="btn btn-primary btn-block btn-lg">Admin Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="container">
            <div class="footer-content">
                <div class="footer-contact">
                    <p>Email: onlinebookstore@gmail.com</p>
                    <p>Phone: +91 9876543210</p>
                </div>
                <p class="footer-copyright">&copy; 2024 Online Book Store Management System. All rights reserved.</p>
                <p class="footer-credit">Designed and developed by <strong>@AIML-III-VIGNAN</strong></p>
            </div>
        </div>
    </footer>
</body>

</html>
