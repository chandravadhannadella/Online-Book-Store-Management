<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header class="site-header" role="banner">
        <div class="container">
            <div class="header-content">
                <h1 class="site-title">Online Book Store Management System</h1>
                <p class="site-tagline">Buy Book App</p>
            </div>
        </div>
    </header>

    <nav class="site-nav" role="navigation" aria-label="Main navigation">
        <div class="container">
            <ul class="nav-list">
                <li><a href="Home.html" class="nav-link">Home</a></li>
                <li><a href="Admin.html" class="nav-link">Admin</a></li>
                <li><a href="Seller.html" class="nav-link">Seller</a></li>
                <li><a href="Buyer.html" class="nav-link">Buyer</a></li>
                <li><a href="About.html" class="nav-link">About</a></li>
                <li><a href="Contact.html" class="nav-link active" aria-current="page">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content" role="main">
        <div class="container container-form">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Contact Us</h2>
                </div>
                <div class="card-body">
                    <form action="#" method="post" novalidate>
                        <div class="form-group">
                            <label for="contactname" class="form-label">Name <span class="required"></span></label>
                            <input type="text" 
                                   id="contactname" 
                                   name="contactname" 
                                   class="form-input" 
                                   placeholder="Enter Your Name" 
                                   required 
                                   autocomplete="name">
                        </div>
                        
                        <div class="form-group">
                            <label for="contactemail" class="form-label">Email <span class="required"></span></label>
                            <input type="email" 
                                   id="contactemail" 
                                   name="contactemail" 
                                   class="form-input" 
                                   placeholder="Enter Email Address" 
                                   required 
                                   autocomplete="email">
                        </div>
                        
                        <div class="form-group">
                            <label for="contactphone" class="form-label">Mobile Number</label>
                            <input type="tel" 
                                   id="contactphone" 
                                   name="contactphone" 
                                   class="form-input" 
                                   placeholder="Enter Mobile Number" 
                                   autocomplete="tel">
                        </div>
                        
                        <div class="form-group">
                            <label for="contactmessage" class="form-label">Message <span class="required"></span></label>
                            <textarea id="contactmessage" 
                                      name="contactmessage" 
                                      class="form-input" 
                                      rows="5" 
                                      placeholder="Write Your Message" 
                                      required></textarea>
                        </div>
                        
                        <div class="form-group mt-xl">
                            <div class="btn-group">
                                <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
                                <button type="reset" class="btn btn-secondary btn-lg">Reset</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="container">
            <div class="footer-content">
                <div class="footer-contact">
                    <p>Email: onlinebookstore@gmail.com</p>
                    <p>Phone: +91 9876543210</p>
                </div>
                <p class="footer-copyright">&copy; 2024 Online Book Store Management System. All rights reserved.</p>
                <p class="footer-credit">Designed and developed by <strong>@AIML-III-VIGNAN</strong></p>
            </div>
        </div>
    </footer>
</body>

</html>
